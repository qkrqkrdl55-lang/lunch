<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점심 메뉴 룰렛 앱</title>
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    /* 룰렛 컨테이너 */
    .roulette-container {
      position: relative;
      width: 360px;
      height: 360px;
      margin-bottom: 25px;
    }

    /* 상단 지침 바늘 (화살표) */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff4757;
      z-index: 10;
    }

    /* 룰렛 캔버스 */
    #rouletteCanvas {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    /* 중앙 LUNCH 원 */
    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #2ed573;
      z-index: 5;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* 컨트롤 요소들 */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 360px;
    }

    .spin-btn {
      width: 100%;
      padding: 14px;
      background-color: #ff4757;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }

    .spin-btn:hover {
      background-color: #ff6b81;
    }

    .spin-btn:active {
      transform: scale(0.98);
    }

    .spin-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 메뉴 관리 입력 폼 */
    .input-group {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    .input-group button {
      padding: 10px 16px;
      background-color: #2ed573;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 메뉴 태그 목록 */
    .menu-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      max-height: 120px;
      overflow-y: auto;
      padding: 5px;
    }

    .menu-item {
      background-color: #eccc68;
      color: #333;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-item span {
      cursor: pointer;
      color: #ff4757;
      font-weight: bold;
    }

    /* 결과 텍스트 */
    .result {
      margin-top: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #2f3542;
      height: 30px;
    }
  </style>
</head>
<body>

  <h1>오늘 뭐 먹지? 🍔</h1>

  <div class="roulette-container">
    <div class="pointer"></div>
    <canvas id="rouletteCanvas" width="360" height="360"></canvas>
    <div class="center-circle">LUNCH</div>
  </div>

  <div class="result" id="resultText"></div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn">돌리기!</button>

    <div class="input-group">
      <input type="text" id="menuInput" placeholder="새 메뉴 입력 (예: 돈까스)" maxlength="10">
      <button id="addBtn">추가</button>
    </div>

    <div class="menu-list" id="menuList"></div>
  </div>

  <script>
    const colors = [
      "#ff7675", "#74b9ff", "#55efc4", "#ffeaa7", 
      "#a29bfe", "#fd79a8", "#fdcb6e", "#81ecec"
    ];

    let menus = ["김치찌개", "짜장면", "제육볶음", "돈까스", "초밥", "햄버거"];
    
    const canvas = document.getElementById("rouletteCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const menuInput = document.getElementById("menuInput");
    const addBtn = document.getElementById("addBtn");
    const menuList = document.getElementById("menuList");
    const resultText = document.getElementById("resultText");

    let rouletteState = { rotation: 0 };

    function drawRoulette() {
      const numSlices = menus.length;
      const arcSize = (2 * Math.PI) / numSlices;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      menus.forEach((menu, i) => {
        const angle = i * arcSize;

        // 1. 파이 조각 그리기
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. 텍스트 그리기
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px Pretendard, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const textAngle = angle + arcSize / 2;
        const textRadius = radius * 0.65;

        ctx.translate(
          centerX + Math.cos(textAngle) * textRadius,
          centerY + Math.sin(textAngle) * textRadius
        );
        ctx.rotate(textAngle + Math.PI / 2);

        ctx.fillText(menu, 0, 0);
        ctx.restore();
      });
    }

    function updateMenuList() {
      menuList.innerHTML = "";
      menus.forEach((menu, index) => {
        const tag = document.createElement("div");
        tag.className = "menu-item";
        tag.innerHTML = `${menu} <span onclick="removeMenu(${index})">&times;</span>`;
        menuList.appendChild(tag);
      });
      drawRoulette();
    }

    window.removeMenu = function(index) {
      if (menus.length <= 2) {
        alert("최소 2개 이상의 메뉴가 필요합니다.");
        return;
      }
      menus.splice(index, 1);
      updateMenuList();
    };

    addBtn.addEventListener("click", () => {
      const newMenu = menuInput.value.trim();
      if (newMenu) {
        menus.push(newMenu);
        menuInput.value = "";
        updateMenuList();
      }
    });

    menuInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addBtn.click();
    });

    spinBtn.addEventListener("click", () => {
      spinBtn.disabled = true;
      resultText.textContent = "";

      const randomDegree = Math.floor(Math.random() * 360);
      const targetRotation = rouletteState.rotation + (360 * 5) + randomDegree;

      gsap.to(rouletteState, {
        rotation: targetRotation,
        duration: 4.5,
        ease: "power4.out",
        onUpdate: () => {
          canvas.style.transform = `rotate(${rouletteState.rotation}deg)`;
        },
        onComplete: () => {
          spinBtn.disabled = false;
          calculateResult(rouletteState.rotation);
        }
      });
    });

    // [수정된 판정 공식]
    function calculateResult(totalRotation) {
      const numSlices = menus.length;
      const sliceAngle = 360 / numSlices;
      
      // 회전 후 실제 각도 (0~359도)
      const currentRotation = totalRotation % 360;

      // 상단 바늘 위치(12시 방향, -90도/270도)에 위치한 캔버스 상의 각도를 역산
      let pointerAngle = (270 - currentRotation) % 360;
      if (pointerAngle < 0) pointerAngle += 360;

      const selectedIndex = Math.floor(pointerAngle / sliceAngle);
      const selectedMenu = menus[selectedIndex];

      resultText.textContent = `🎉 오늘 점심은 [ ${selectedMenu} ] 입니다!`;
    }

    updateMenuList();
  </script>
</body>
</html>
